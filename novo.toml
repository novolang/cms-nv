[package]
name        = "cms-nv"
version     = "0.1.0"
description = "Cryptographic Message Syntax, RFC 5652, over asn1-nv and x509-nv: ContentInfo with data, signed-data, enveloped-data, digested-data, encrypted-data and the AuthEnvelopedData of RFC 5083.  SignedData verifies RSASSA-PKCS1-v1_5 and RSASSA-PSS with SHA-256 and SHA-384, ECDSA on P-256 and Ed25519, and signs with the last two; the signed attributes are checked and the chain is the caller's.  EnvelopedData opens KEK and password recipients with AES-CBC and AES-GCM content.  RSA signing and RSA and ECDH recipients are stated as not implemented."
license     = "Apache-2.0"
stability   = "experimental"
layer       = "core"
category    = "crypto"
tags        = ["cms", "pkcs7", "rfc-5652", "rfc-5083", "rfc-3211", "smime", "signed-data", "enveloped-data", "x509", "der"]
repository  = "https://github.com/novolang/cms-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

[docs.pages]
"README.md" = "Signed, enveloped and encrypted messages in the formats of S/MIME"

[dependencies]
asn1-nv    = "^0.1.1"
x509-nv    = "^0.1.0"
crypto-nv  = "^0.1.8"
rsa-nv     = "^0.1.0"
p256-nv    = "^0.1.1"
ed25519-nv = "^0.1.1"
pbkdf2-nv  = "^0.1.0"
